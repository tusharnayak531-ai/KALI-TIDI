  plus:'<path d="M12 5v14M5 12h14"/>',

  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

  trash:'<path d="M4 7h16M10 11v7m4-7v7M6 7l1 14h10l1-14M9 7V4h6v3"/>',
  left:'<path d="m14 18-6-6 6-6"/>',right:'<path d="m10 18 6-6-6-6"/>',
  check:'<path d="m5 12 5 5L20 7"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',

  trophy:'<path d="M7 3h10v7a5 5 0 0 1-10 0V3ZM7 5H3v2a5 5 0 0 0 5 5M17 5h4v2a5 5 0 0 1-5 5M12 15v4m-4 2h8"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>'
};
const icon = (name,size=18) => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.info}</svg>`;
const esc = (str) => String(str??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = n => Number.isFinite(Number(n)) ? Number(n) : 0;
const round = (n,d=0) => val(n).toLocaleString('en-IN',{maximumFractionDigits:d,minimumFractionDigits:0});
const percent = (n,target) => target>0?Math.max(0,Math.min(100,100*n/target)):0;
const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2,9)}`;
const localDay = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const dateFromDay = (day) => new Date(`${day}T12:00:00`);
const dateOffset = (day,n) => {const d=dateFromDay(day);d.setDate(d.getDate()+n);return localDay(d)};
const prettyDay = day => dateFromDay(day).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const shortDay = day => dateFromDay(day).toLocaleDateString('en-IN',{weekday:'short'});
const sameWeek = (a,b) => {let d=dateFromDay(b);d.setDate(d.getDate() - (d.getDay()+6)%7);return a>=localDay(d)&&a<=dateOffset(localDay(d),6)};
function defaults(){return {version:1,profile:{name:'Athlete',goal:'Build consistency',calories:2400,protein:150,carbs:260,fat:70,water:3000},foods:[],meals:[],workouts:[],weights:[],water:[]}};
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw||typeof raw!=='object')return defaults();const d=defaults();return {version:1,profile:{...d.profile,...(raw.profile||{})},foods:Array.isArray(raw.foods)?raw.foods:[],meals:Array.isArray(raw.meals)?raw.meals:[],workouts:Array.isArray(raw.workouts)?raw.workouts:[],weights:Array.isArray(raw.weights)?raw.weights:[],water:Array.isArray(raw.water)?raw.water:[]}}catch(e){return defaults()}}
let state=load(),page='dashboard',selectedDate=localDay(),chartType='calories',foodSearch='',workoutSearch='',modal='',toastTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Could not save locally. Check your browser storage settings.')}}
function notify(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
const allFoods = () => [...DEFAULT_FOODS,...state.foods];
function macros(day){return state.meals.filter(x=>x.date===day).reduce((a,x)=>({kcal:a.kcal+val(x.kcal),p:a.p+val(x.p),c:a.c+val(x.c),f:a.f+val(x.f)}),{kcal:0,p:0,c:0,f:0})}
function hydration(day){return state.water.filter(x=>x.date===day).reduce((a,x)=>a+val(x.ml),0)}
const workoutsDay = day => state.workouts.filter(x=>x.date===day);
const thisWeekSessions = () => new Set(state.workouts.filter(x=>sameWeek(x.date,localDay())).map(x=>x.date)).size;
const workVolume = day => workoutsDay(day).reduce((sum,x)=>sum+val(x.weight)*val(x.sets)*val(x.reps),0);
const latestWeight = () => [...state.weights].sort((a,b)=>b.date.localeCompare(a.date)||(b.logged||'').localeCompare(a.logged||''))[0];
function head(title,subtitle,actions='',eyebrow='YOUR TRAINING HQ'){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p></div>${actions?`<div class="title-actions">${actions}</div>`:''}</div>`}
const dateSelector = () => `<div class="date-selector"><button type="button" data-action="date-prev" aria-label="Previous day">${icon('left',15)}</button><input aria-label="Selected day" type="date" id="selected-date" value="${esc(selectedDate)}" max="${localDay()}"/><button type="button" data-action="date-next" aria-label="Next day" ${selectedDate>=localDay()?'disabled':''}>${icon('right',15)}</button></div>`;
function statsCard(label,value,unit,foot,ico,color=''){return `<div class="stat-card"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon ${color}">${icon(ico,18)}</span></div><div class="stat-value">${value}<span class="stat-unit">${unit}</span></div><div class="stat-foot">${foot}</div></div>`}
function weekData(fn){return Array.from({length:7},(_,i)=>{let day=dateOffset(selectedDate,i-6);return {day,label:shortDay(day),value:fn(day)}})}
function barChart(){const target=chartType==='calories'?val(state.profile.calories):Math.max(1000,...weekData(workVolume).map(x=>x.value));const items=weekData(chartType==='calories'?d=>macros(d).kcal:workVolume);const max=Math.max(1,target,...items.map(x=>x.value))*1.14;const W=680,H=214,left=42,right=14,top=13,bottom=30,innerH=H-top-bottom,innerW=W-left-right;const y = v=>top+innerH-(v/max)*innerH;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${chartType==='calories'?'calories consumed':'training volume'} bar chart">`;
for(let i=0;i<5;i++){const v=max*i/4;const yy=y(v);svg+=`<line class="chart-grid" x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="${left-9}" y="${yy+3}" text-anchor="end">${v>=1000?`${round(v/1000,1)}k`:round(v)}</text>`}
if(chartType==='calories'){const yy=y(target);svg+=`<line class="chart-target" x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}"/>`}
const step=innerW/7;items.forEach((d,i)=>{const bw=step*.38;const x=left+i*step+(step-bw)/2;const bh=d.value/max*innerH;const cls=d.day===selectedDate?'chart-bar today':'chart-bar';svg+=`<rect class="${cls}" x="${x.toFixed(1)}" y="${(top+innerH-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="5"><title>${esc(prettyDay(d.day))}: ${round(d.value)} ${chartType==='calories'?'kcal':'kg volume'}</title></rect><text class="chart-label" x="${(left+i*step+step/2).toFixed(1)}" y="${H-8}" text-anchor="middle" ${d.day===selectedDate?'style="fill:#d4fa73"':''}>${d.label}</text>`});return svg+'</svg>'}
function ring(day){const m=macros(day),pct=percent(m.kcal,val(state.profile.calories));return `<div class="ring" style="background:conic-gradient(var(--accent) ${pct}%,#283541 ${pct}% 100%)"><div class="ring-center"><strong>${round(pct)}%</strong><span>daily goal</span></div></div><div class="macro-mini">${[['Protein','p','#b3a0e7'],['Carbs','c','#8cbdff'],['Fats','f','#e9b97c']].map(([name,key,color])=>`<div class="macro-mini-cell"><strong><i class="macro-dot" style="background:${color}"></i>${round(m[key])}g</strong><span>${name}</span></div>`).join('')}</div>`}
function activityRows(day,type){const all=(type==='workout'?workoutsDay(day).map(x=>({id:x.id,name:x.exercise,detail:`${x.sets} sets × ${x.reps} reps · ${x.weight} kg`,right:`${round(val(x.weight)*val(x.sets)*val(x.reps))} kg`,kind:'workout'})):state.meals.filter(x=>x.date===day).map(x=>({id:x.id,name:x.name,detail:`${x.grams} g · ${x.meal}`,right:`${round(x.kcal)} kcal`,kind:'food'}))).reverse();if(!all.length)return `<div class="empty-state">${icon(type==='workout'?'dumbbell':'nutrition',30)}<strong>No ${type==='workout'?'workouts':'meals'} logged</strong><p>Start tracking to see your progress here.</p><button class="btn btn-small" data-modal="${type==='workout'?'workout':'food'}">${icon('plus',14)} Add ${type==='workout'?'workout':'food'}</button></div>`;return `<div class="activity-list">${all.slice(0,4).map(x=>`<div class="activity-row"><span class="activity-icon ${x.kind==='food'?'orange':''}">${icon(x.kind==='food'?'nutrition':'dumbbell',18)}</span><div class="activity-copy"><strong>${esc(x.name)}</strong><span>${esc(x.detail)}</span></div><div class="activity-right">${x.right}</div></div>`).join('')}</div>`}
function dashboard(){const m=macros(selectedDate),p=state.profile,remaining=val(p.calories)-m.kcal,dayCount=workoutsDay(selectedDate).length;return `${head(`Welcome back, <span style="color:var(--accent)">${esc(p.name)}</span>.`,'Consistency compounds. Track every rep, meal and milestone.',dateSelector(),'LET’S GET STRONGER')}
<section class="hero"><div><div class="eyebrow">THE DAILY MISSION</div><h2>Build the body.<br/><span>Own the process.</span></h2><p>A stronger you starts with small actions. Log a session or fuel your day.</p><div class="title-actions"><button class="btn btn-primary" data-modal="workout">${icon('plus',15)} Log workout</button><button class="btn btn-subtle" data-modal="food">${icon('plus',15)} Log meal</button></div></div><div class="hero-meta"><small>THIS WEEK</small><strong>${thisWeekSessions()}</strong><span>training days</span></div></section>
<section class="stats-grid">${statsCard('Calories eaten',round(m.kcal),'kcal',`Daily target: ${round(p.calories)} kcal`,'flame')}${statsCard(remaining>=0?'Calories remaining':'Over calorie target',round(Math.abs(remaining)),'kcal',remaining>=0?'Your daily calorie budget': 'You are above your set target','target','blue')}${statsCard('Protein logged',round(m.p,1),'g',`${round(percent(m.p,val(p.protein)))}% of ${round(p.protein)} g goal`,'bolt','purple')}${statsCard('Workout exercises',round(dayCount),'logged',`${round(workVolume(selectedDate))} kg total lifted volume`,'dumbbell','orange')}</section>

<section class="card"><div class="card-head"><div><h2 class="card-title">Nutrition target</h2><p class="card-subtitle">${round(m.kcal)} / ${round(p.calories)} kcal</p></div><button class="link-button" data-nav="nutrition">View diary →</button></div>${ring(selectedDate)}</section></div>

const macroCard=(label,number,target,unit,color,ico)=>`<div class="macro-card"><div class="macro-label">${label}<span class="macro-icon" style="background:${color}20;color:${color}">${icon(ico,16)}</span></div><div class="macro-value">${round(number,1)} <small>/ ${round(target)} ${unit}</small></div><div class="progress-track"><div class="progress-fill" style="width:${percent(number,target)}%;background:${color}"></div></div></div>`;
function nutritionPage(){const m=macros(selectedDate),p=state.profile,all=allFoods().filter(x=>x.name.toLowerCase().includes(foodSearch.toLowerCase()));const entries=state.meals.filter(x=>x.date===selectedDate);return `${head('Nutrition dashboard','Food tracking made simple. Fuel your goals one meal at a time.',`${dateSelector()}<button class="btn btn-primary" data-modal="food">${icon('plus',16)} Add food</button>`,'FUEL YOUR PROGRESS')}
<div class="nutrition-grid">${macroCard('Calories',m.kcal,p.calories,'kcal','#d4fa73','flame')}${macroCard('Protein',m.p,p.protein,'g','#b3a0e7','bolt')}${macroCard('Carbs',m.c,p.carbs,'g','#8cbdff','target')}${macroCard('Fats',m.f,p.fat,'g','#e9b97c','nutrition')}</div>

<aside><section class="card"><div class="card-head"><div><h2 class="card-title">Food library</h2><p class="card-subtitle">Quick search and log common foods</p></div></div><div class="searchbox" style="max-width:none;margin-bottom:9px">${icon('search',15)}<input type="search" id="food-search" value="${esc(foodSearch)}" placeholder="Search Indian & everyday foods" aria-label="Search food library"/></div><div class="food-directory">${all.slice(0,7).map(x=>`<div class="food-directory-row"><span class="food-avatar" style="flex:0 0 32px;height:32px">${esc(x.emoji||'🍽️')}</span><div style="flex:1;min-width:0"><strong>${esc(x.name)}</strong><span>${round(x.kcal)} kcal / 100g</span></div><button class="btn btn-small" data-quick-food="${esc(x.id)}">Add</button></div>`).join('')||'<p class="food-hint">No foods match your search.</p>'}</div><button class="btn btn-small" style="width:100%;margin-top:14px" data-modal="custom-food">${icon('plus',14)} Create custom food</button><p class="small-note">Nutrition values are approximate estimates per 100g. Labels, portions and recipes vary. You can add foods using your packaging values.</p></section></aside></div>`}
function lineChart(){const list=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date)||(a.logged||'').localeCompare(b.logged||'')).slice(-12);if(!list.length)return `<div class="empty-state">${icon('scale',30)}<strong>No weigh-ins yet</strong><p>Add your current weight to start your progress graph.</p><button class="btn btn-small btn-primary" data-modal="weight">${icon('plus',13)} Add weigh-in</button></div>`;
const W=700,H=230,L=45,R=28,T=23,B=39;const ys=list.map(x=>val(x.kg)),lo=Math.floor(Math.min(...ys)-1),hi=Math.ceil(Math.max(...ys)+1),span=Math.max(2,hi-lo);const x=i=>L+(list.length===1?.5:i/(list.length-1))*(W-L-R),y=n=>T+(H-T-B)*(1-(n-lo)/span);let out=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight over time" style="width:100%;height:230px">`;
for(let k=0;k<=4;k++){const yy=T+k*(H-T-B)/4;out+=`<line class="chart-grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="${L-8}" y="${yy+4}" text-anchor="end">${round(hi-span*k/4,1)}</text>`}out+=`<polyline class="weight-line" points="${list.map((d,i)=>`${x(i)},${y(d.kg)}`).join(' ')}"/>`;list.forEach((d,i)=>{out+=`<circle class="weight-point" cx="${x(i)}" cy="${y(d.kg)}" r="5"><title>${prettyDay(d.date)}: ${d.kg} kg</title></circle>`;if(i===0||i===list.length-1||list.length<4)out+=`<text class="chart-label" x="${x(i)}" y="${H-10}" text-anchor="middle">${dateFromDay(d.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</text>`});return out+'</svg>'}
function progressPage(){const weights=[...state.weights].sort((a,b)=>b.date.localeCompare(a.date)||(b.logged||'').localeCompare(a.logged||''));const current=weights[0],first=weights[weights.length-1],difference=current&&first?val(current.kg)-val(first.kg):0;return `${head('Progress insights','See the work adding up. One week, one rep, one day at a time.',`<button class="btn btn-primary" data-modal="weight">${icon('plus',16)} Log bodyweight</button>`,'TRUST THE PROCESS')}
<div class="progress-top">${statsCard('Latest bodyweight',current?round(current.kg,1):'—','kg',current?`Logged ${prettyDay(current.date)}`:'Add a weigh-in to begin','scale')}${statsCard('Weight change',weights.length>1?`${difference>0?'+':''}${round(difference,1)}`:'—','kg','Since first logged weigh-in','progress','blue')}${statsCard('Training volume',round(state.workouts.reduce((n,x)=>n+val(x.sets)*val(x.reps)*val(x.weight),0)),'kg','Cumulative logged workload','dumbbell','purple')}</div>
<section class="card progress-chart-card"><div class="card-head"><div><h2 class="card-title">Bodyweight trend</h2><p class="card-subtitle">Your latest 12 weigh-ins, shown in kilograms</p></div><span class="info-pill">${weights.length} entries</span></div>${lineChart()}</section>
<div class="lower-grid"><section class="card"><div class="card-head"><div><h2 class="card-title">Weigh-in history</h2><p class="card-subtitle">Consistency matters more than day-to-day fluctuations</p></div></div><div class="table-scroll"><table class="data-table"><thead><tr><th>DATE</th><th>BODYWEIGHT</th><th>NOTES</th><th></th></tr></thead><tbody>${weights.length?weights.map(x=>`<tr><td>${prettyDay(x.date)}</td><td><strong>${round(x.kg,1)} kg</strong></td><td>${esc(x.note||'—')}</td><td><button class="delete-btn" data-remove-weight="${esc(x.id)}" aria-label="Delete weigh-in">${icon('trash',16)}</button></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty-state">No weigh-ins recorded yet.</div></td></tr>'}</tbody></table></div></section><section class="card"><div class="card-head"><div><h2 class="card-title">All-time achievements</h2><p class="card-subtitle">Your effort in numbers</p></div></div>${[['Workout days',new Set(state.workouts.map(x=>x.date)).size,'dumbbell'],['Food entries',state.meals.length,'nutrition'],['Hydration logs',state.water.length,'droplet'],['Bodyweight entries',state.weights.length,'scale']].map(([label,n,ico])=>`<div class="activity-row"><span class="activity-icon">${icon(ico,18)}</span><div class="activity-copy"><strong>${label}</strong><span>Logged in ForgeFit</span></div><div class="activity-right">${round(n)}</div></div>`).join('')}<div class="training-note"><strong>Perspective:</strong> Daily bodyweight naturally fluctuates. Focus on trends over several weeks, not one measurement.</div></section></div>`}
function settingsPage(){const p=state.profile;return `${head('Your settings','Personalize your dashboard and take control of your data.','','YOUR WORKSPACE')}

<form id="settings-form"><div class="form-grid"><div class="field"><label for="profile-name">Your display name</label><input id="profile-name" name="name" value="${esc(p.name)}" required maxlength="30"/></div><div class="field"><label for="profile-goal">Your current goal</label><select name="goal" id="profile-goal">${['Build consistency','Lose fat','Build muscle','Maintain weight','Improve fitness'].map(g=>`<option ${p.goal===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label for="target-calories">Calories (kcal/day)</label><input id="target-calories" name="calories" type="number" min="1" max="15000" step="1" value="${esc(p.calories)}" required/></div><div class="field"><label for="target-protein">Protein (g/day)</label><input id="target-protein" name="protein" type="number" min="1" max="1000" step="1" value="${esc(p.protein)}" required/></div><div class="field"><label for="target-carbs">Carbohydrates (g/day)</label><input id="target-carbs" name="carbs" type="number" min="1" max="1500" step="1" value="${esc(p.carbs)}" required/></div><div class="field"><label for="target-fat">Fat (g/day)</label><input id="target-fat" name="fat" type="number" min="1" max="600" step="1" value="${esc(p.fat)}" required/></div><div class="field"><label for="target-water">Water (ml/day)</label><input id="target-water" name="water" type="number" min="100" max="20000" step="100" value="${esc(p.water)}" required/><span class="field-help">These are editable example targets, not medical recommendations.</span></div></div><div class="settings-actions"><button class="btn btn-primary" type="submit">${icon('check',15)} Save changes</button></div></form></section>

function nav(){const items=[['dashboard','Overview','dashboard'],['workouts','Workouts','dumbbell'],['nutrition','Nutrition','nutrition'],['progress','Progress','progress'],['settings','Settings','settings']];document.getElementById('desktop-nav').innerHTML=items.map(([key,label,ico])=>`<button class="nav-button ${page===key?'active':''}" data-nav="${key}" ${page===key?'aria-current="page"':''}>${icon(ico,19)}<span>${label}</span></button>`).join('');document.getElementById('mobile-nav').innerHTML=items.map(([key,label,ico])=>`<button class="${page===key?'active':''}" data-nav="${key}" ${page===key?'aria-current="page"':''}>${icon(ico,19)}${label}</button>`).join('');document.getElementById('current-page-label').textContent=({dashboard:'Dashboard',workouts:'Workouts',nutrition:'Nutrition',progress:'Progress',settings:'Settings'})[page];document.getElementById('sidebar-profile').textContent=state.profile.name;const initial=(state.profile.name||'A').trim().slice(0,1).toUpperCase();document.querySelector('.avatar').textContent=initial;document.querySelector('#top-avatar').textContent=initial;document.querySelector('#export-top').innerHTML=icon('download',19)}
function render(){nav();document.getElementById('main').innerHTML=({dashboard:dashboard,workouts:workoutsPage,nutrition:nutritionPage,progress:progressPage,settings:settingsPage})[page]();}
function navigate(to){if(!['dashboard','workouts','nutrition','progress','settings'].includes(to))return;page=to;render();window.scrollTo({top:0,behavior:'smooth'})}
function field(label,name,type='text',options={}){const attrs=Object.entries(options).filter(([k])=>!['value','selectOptions','placeholder'].includes(k)).map(([k,v])=>`${k}="${esc(v)}"`).join(' ');if(type==='select')return `<div class="field"><label for="m-${name}">${label}</label><select id="m-${name}" name="${name}" ${attrs}>${options.selectOptions.map(o=>{const [v,text]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${options.value==v?'selected':''}>${esc(text)}</option>`}).join('')}</select></div>`;return `<div class="field"><label for="m-${name}">${label}</label><input id="m-${name}" name="${name}" type="${type}" value="${esc(options.value??'')}" placeholder="${esc(options.placeholder||'')}" ${attrs}/></div>`}
function openModal(kind,extra=''){modal=kind;let title,subtitle,form;if(kind==='workout'){
  const template=TEMPLATES.find(x=>x.id===extra),exercise=template?template.exercises[0]:'';

function formActions(label){return `<div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">${icon('check',15)} ${label}</button></div>`}
function closeModal(){modal='';document.getElementById('modal-root').innerHTML=''}
function requiredNum(form,name,min,max){const n=Number(form.elements.namedItem(name)?.value);if(!Number.isFinite(n)||n<min||n>max)throw new Error(`Enter a valid ${name} (${min}–${max}).`);return n}
function addWorkout(form){const date=form.elements.date.value,exercise=form.elements.exercise.value.trim();if(!exercise||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>localDay())throw new Error('Enter a valid exercise and date.');state.workouts.push({id:uid(),date,exercise,muscle:form.elements.muscle.value,sets:requiredNum(form,'sets',1,100),reps:requiredNum(form,'reps',1,1000),weight:requiredNum(form,'weight',0,2000),notes:form.elements.notes.value.trim().slice(0,160),logged:new Date().toISOString()});selectedDate=date;save();closeModal();render();notify('Workout logged successfully')}
function addFood(form){const ref=allFoods().find(x=>x.id===form.elements.foodId.value),date=form.elements.date.value;if(!ref||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>localDay())throw new Error('Select a valid food and date.');const grams=requiredNum(form,'grams',.1,10000),factor=grams/100;state.meals.push({id:uid(),foodId:ref.id,name:ref.name,emoji:ref.emoji||'🍽️',grams,meal:form.elements.meal.value,date,kcal:ref.kcal*factor,p:ref.p*factor,c:ref.c*factor,f:ref.f*factor,logged:new Date().toISOString()});selectedDate=date;save();closeModal();render();notify('Meal added to your diary')}
function addCustomFood(form){const name=form.elements.name.value.trim();if(!name)throw new Error('Enter a food name.');const food={id:'custom-'+uid(),name,emoji:'🥗',kcal:requiredNum(form,'kcal',0,3000),p:requiredNum(form,'p',0,100),c:requiredNum(form,'c',0,100),f:requiredNum(form,'f',0,100)};state.foods.push(food);save();closeModal();render();notify('Custom food saved — ready to log')}
function addWeight(form){const date=form.elements.date.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>localDay())throw new Error('Enter a valid date.');state.weights.push({id:uid(),date,kg:requiredNum(form,'kg',10,600),note:form.elements.note.value.trim().slice(0,100),logged:new Date().toISOString()});selectedDate=date;save();closeModal();render();notify('Bodyweight logged successfully')}
function saveProfile(form){const name=form.elements.name.value.trim();if(!name)throw new Error('Display name is required.');const next={name:name.slice(0,30),goal:form.elements.goal.value};for(const [k,max] of [['calories',15000],['protein',1000],['carbs',1500],['fat',600],['water',20000]])next[k]=requiredNum(form,k,1,max);state.profile=next;save();render();notify('Your targets have been updated')}
function downloadBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forgefit-backup-${localDay()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);notify('Backup downloaded')}
function isValidImport(data){if(!data||typeof data!=='object'||!data.profile||typeof data.profile.name!=='string'||!Array.isArray(data.meals)||!Array.isArray(data.workouts)||!Array.isArray(data.weights)||!Array.isArray(data.water)||!Array.isArray(data.foods))return false;const p=data.profile;return ['calories','protein','carbs','fat','water'].every(k=>Number.isFinite(Number(p[k]))&&Number(p[k])>0)}
function importBackup(file){if(!file||file.size>5_000_000){notify('Backup must be a JSON file smaller than 5 MB');return}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!isValidImport(data))throw Error('Invalid backup format.');if(!window.confirm('Replace all current local data with this backup? This cannot be undone.'))return;state={...defaults(),...data,profile:{...defaults().profile,...data.profile},version:1};delete state.exportedAt;save();render();notify('Backup restored successfully')}catch(e){notify('Could not import: '+e.message)}};reader.readAsText(file)}
function handleClicks(event){const navBtn=event.target.closest('[data-nav]');if(navBtn){navigate(navBtn.dataset.nav);return}const md=event.target.closest('[data-modal]');if(md){openModal(md.dataset.modal);return}const quick=event.target.closest('[data-quick-food]');if(quick){openModal('food',quick.dataset.quickFood);return}const template=event.target.closest('[data-template]');if(template){openModal('workout',template.dataset.template);return}const bar=event.target.closest('[data-chart]');if(bar){chartType=bar.dataset.chart;render();return}const waterBtn=event.target.closest('[data-water]');if(waterBtn){state.water.push({id:uid(),date:selectedDate,ml:Number(waterBtn.dataset.water)});save();render();notify(`${waterBtn.dataset.water} ml water added`);return}for(const [attribute,key,message] of [['remove-food','meals','Food entry removed'],['remove-workout','workouts','Workout removed'],['remove-weight','weights','Weigh-in removed']]){const el=event.target.closest(`[data-${attribute}]`);if(el){state[key]=state[key].filter(x=>x.id!==el.dataset[attribute.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]);save();render();notify(message);return}}
const act=event.target.closest('[data-action]');if(!act){if(event.target.id==='modal-scrim')closeModal();return}switch(act.dataset.action){case 'close-modal':closeModal();break;case 'date-prev':selectedDate=dateOffset(selectedDate,-1);render();break;case 'date-next':if(selectedDate<localDay())selectedDate=dateOffset(selectedDate,1);render();break;case 'undo-water':{const i=state.water.findLastIndex?state.water.findLastIndex(x=>x.date===selectedDate):state.water.map(x=>x.date).lastIndexOf(selectedDate);if(i>=0){state.water.splice(i,1);save();render();notify('Last water entry removed')}else notify('No water to undo');break}case 'export':downloadBackup();break;case 'import-trigger':document.getElementById('import-input')?.click();break;case 'reset':if(window.confirm('Delete ALL ForgeFit logs and settings stored in this browser? Export a backup first.')){state=defaults();selectedDate=localDay();save();render();notify('Local data deleted')}break;default:break}}
function handleSubmit(event){const form=event.target;if(!['workout-form','food-form','custom-food-form','weight-form','settings-form'].includes(form.id))return;event.preventDefault();try{if(!form.reportValidity())return;({ 'workout-form':addWorkout,'food-form':addFood,'custom-food-form':addCustomFood,'weight-form':addWeight,'settings-form':saveProfile})[form.id](form)}catch(e){notify(e.message)}}
document.addEventListener('click',handleClicks);
document.addEventListener('submit',handleSubmit);
document.addEventListener('change',e=>{if(e.target.id==='selected-date'){const date=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&date<=localDay()){selectedDate=date;render()}else{notify('Please select a valid past or current date');render()}}else if(e.target.id==='import-input'){importBackup(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='food-search'){const pos=e.target.selectionStart;foodSearch=e.target.value;const library=document.querySelector('.food-directory');if(library){const filtered=allFoods().filter(x=>x.name.toLowerCase().includes(foodSearch.toLowerCase()));library.innerHTML=filtered.slice(0,7).map(x=>`<div class="food-directory-row"><span class="food-avatar" style="flex:0 0 32px;height:32px">${esc(x.emoji||'🍽️')}</span><div style="flex:1;min-width:0"><strong>${esc(x.name)}</strong><span>${round(x.kcal)} kcal / 100g</span></div><button class="btn btn-small" data-quick-food="${esc(x.id)}">Add</button></div>`).join('')||'<p class="food-hint">No foods match your search.</p>'}}else if(e.target.id==='workout-search'){workoutSearch=e.target.value;const old=document.activeElement;render();const target=document.querySelector('#workout-search');if(target){target.focus();target.setSelectionRange(workoutSearch.length,workoutSearch.length)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
})();

</script>
</body>
